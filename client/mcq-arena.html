<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COSMODEX — MCQ Battle Arena</title>
<meta name="description" content="Real-time 1v1 MCQ trivia battle arena. Answer CS questions faster than your opponent!">
<script src="/socket.io/socket.io.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e17;
  --surface:#111827;
  --border:#1f2937;
  --muted:#4b5563;
  --text:#e2e8f0;
  --dim:#94a3b8;
  --blue:#3b82f6;
  --green:#22c55e;
  --red:#ef4444;
  --yellow:#f59e0b;
  --purple:#a855f7;
  --cyan:#06b6d4;
}
body{
  font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
  height:100vh;overflow:hidden;display:flex;flex-direction:column;
  background:radial-gradient(ellipse 70% 50% at 50% 0%,#0d1f2d 0%,var(--bg) 70%);
}

/* ── TOAST ── */
#toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);
  background:#1e293b;border:1px solid var(--border);color:var(--text);
  padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;
  z-index:9999;transition:transform .3s ease;pointer-events:none;white-space:nowrap;
}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--green);color:var(--green)}
#toast.err{border-color:var(--red);color:var(--red)}
#toast.warn{border-color:var(--yellow);color:var(--yellow)}

/* ── TOP BAR ── */
.topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:12px 24px;display:flex;align-items:center;gap:16px;flex-shrink:0;
}
.topbar-logo{font-size:16px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(135deg,#4ade80,#22c55e);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.round-pill{
  background:#052e16;color:#4ade80;font-size:12px;font-weight:700;
  padding:5px 14px;border-radius:20px;letter-spacing:.5px;
}
.topbar-spacer{flex:1}
.timer-circle{
  width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:900;font-family:'JetBrains Mono',monospace;
  color:#fff;position:relative;
  background:conic-gradient(var(--green) 0deg,rgba(34,197,94,.15) 0deg);
  transition:background .3s linear;
}
.timer-circle::before{
  content:'';position:absolute;inset:3px;border-radius:50%;
  background:var(--surface);
}
.timer-circle span{position:relative;z-index:1}
.timer-circle.warn span{color:var(--yellow)}
.timer-circle.danger span{color:var(--red);animation:flash .5s infinite}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.4}}
.btn-forfeit-mcq{
  background:none;border:1px solid var(--border);color:var(--red);padding:6px 14px;
  border-radius:8px;font-size:11px;cursor:pointer;font-family:'Inter',sans-serif;
  font-weight:700;transition:all .15s;letter-spacing:.5px;
}
.btn-forfeit-mcq:hover{border-color:var(--red);background:#3d0a0a}

/* ── MAIN CONTENT ── */
.mcq-main{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:20px 24px;gap:18px}

/* ── QUESTION CARD ── */
.question-card{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:28px 32px;position:relative;overflow:hidden;
}
.question-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--green),var(--cyan),var(--green));
}
.q-category{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:8px}
.q-difficulty{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;text-transform:uppercase;margin-left:8px}
.q-difficulty.easy{background:#052e16;color:#4ade80}
.q-difficulty.medium{background:#2d1f00;color:#fbbf24}
.q-difficulty.hard{background:#3d0a0a;color:#f87171}
.q-text{font-size:17px;font-weight:600;line-height:1.6;margin-top:8px;min-height:48px}

/* ── ANSWER OPTIONS ── */
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option-btn{
  background:var(--surface);border:2px solid var(--border);border-radius:12px;
  padding:16px 20px;font-size:14px;font-weight:600;color:var(--text);
  cursor:pointer;transition:all .2s ease;text-align:left;
  font-family:'Inter',sans-serif;position:relative;
}
.option-btn:hover:not(.locked){
  border-color:var(--blue);background:#111d2e;transform:translateY(-2px);
  box-shadow:0 4px 16px rgba(59,130,246,.15);
}
.option-btn .opt-label{
  display:inline-block;width:28px;height:28px;border-radius:8px;
  background:rgba(255,255,255,.06);text-align:center;line-height:28px;
  font-size:12px;font-weight:800;color:var(--dim);margin-right:12px;
  flex-shrink:0;
}
.option-btn.selected{border-color:var(--blue);background:#111d2e}
.option-btn.selected .opt-label{background:var(--blue);color:#fff}
.option-btn.correct{border-color:var(--green);background:#052e16}
.option-btn.correct .opt-label{background:var(--green);color:#000}
.option-btn.wrong{border-color:var(--red);background:#3d0a0a}
.option-btn.wrong .opt-label{background:var(--red);color:#fff}
.option-btn.locked{cursor:default;opacity:.7}
.option-btn.locked:hover{transform:none;box-shadow:none}

/* ── SCOREBOARD ── */
.scoreboard{
  display:flex;align-items:center;justify-content:center;gap:32px;
  padding:16px 20px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;flex-shrink:0;
}
.sb-player{
  display:flex;align-items:center;gap:12px;min-width:180px;
}
.sb-player.right{flex-direction:row-reverse;text-align:right}
.sb-avi{font-size:32px}
.sb-info{display:flex;flex-direction:column;gap:2px}
.sb-name{font-size:13px;font-weight:700}
.sb-you{font-size:10px;color:var(--blue)}
.sb-score{font-size:28px;font-weight:900;font-family:'JetBrains Mono',monospace}
.sb-score.leading{color:var(--green)}
.sb-score.losing{color:var(--red)}
.sb-score.tied{color:var(--yellow)}
.sb-streak{font-size:10px;color:var(--yellow);font-weight:700}
.sb-vs{font-size:18px;font-weight:900;color:var(--muted)}
.sb-status{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px}
.sb-answered{background:#052e16;color:#4ade80}
.sb-waiting{background:#2d1f00;color:#fbbf24}

/* ── ROUND HISTORY ── */
.round-history{
  display:flex;align-items:center;gap:6px;justify-content:center;
  padding:10px 16px;flex-shrink:0;
}
.rh-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-right:8px}
.rh-dot{
  width:24px;height:24px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:800;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);
}
.rh-dot.correct{background:#052e16;border-color:#22c55e;color:#4ade80}
.rh-dot.wrong{background:#3d0a0a;border-color:#ef4444;color:#f87171}
.rh-dot.current{border-color:var(--blue);color:var(--blue);box-shadow:0 0 8px rgba(59,130,246,.3)}
.rh-dot.upcoming{opacity:.3}

/* ── RESULT SCREEN ── */
#mcq-result{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;flex:1;position:fixed;inset:0;z-index:200;
  background:radial-gradient(ellipse 60% 50% at 50% 40%, #0f1f3d 0%, var(--bg) 70%);
}
#mcq-result.on{display:flex}
.res-icon{font-size:80px;animation:pop .6s ease}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.1)}100%{transform:scale(1)}}
.res-title{font-size:36px;font-weight:900;letter-spacing:2px}
.win-t{color:var(--green)}
.lose-t{color:var(--red)}
.draw-t{color:var(--yellow)}
.res-sub{font-size:14px;color:var(--dim);max-width:380px;text-align:center;line-height:1.6}
.stat-row{display:flex;gap:16px;margin-top:4px}
.sbox{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:16px 24px;text-align:center;min-width:110px;
}
.sval{font-size:28px;font-weight:800}
.slbl{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.play-again{
  background:linear-gradient(135deg,var(--green),var(--cyan));
  color:#000;border:none;padding:12px 36px;border-radius:10px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;
  transition:all .2s;margin-top:6px;box-shadow:0 4px 20px rgba(34,197,94,.3);
}
.play-again:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(34,197,94,.4)}

/* ── REVEAL OVERLAY ── */
.reveal-banner{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);
  background:var(--surface);border:2px solid var(--green);border-radius:16px;
  padding:20px 36px;text-align:center;z-index:50;
  box-shadow:0 0 40px rgba(34,197,94,.2);
  transition:transform .3s ease;pointer-events:none;
}
.reveal-banner.on{transform:translate(-50%,-50%) scale(1)}
.reveal-text{font-size:16px;font-weight:800;color:var(--green)}

/* ── LOADING STATE ── */
.loading-state{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
.loading-spinner{font-size:40px;animation:spin 1.5s linear infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.loading-text{font-size:14px;color:var(--dim)}
</style>
</head>
<body>

<div id="toast"></div>

<!-- ── TOP BAR ── -->
<div class="topbar">
  <span class="topbar-logo">🧠 MCQ BATTLE</span>
  <span class="round-pill" id="round-pill">Round 1 / 10</span>
  <span class="topbar-spacer"></span>
  <div class="timer-circle" id="timer-circle"><span id="timer-val">15</span></div>
  <button class="btn-forfeit-mcq" onclick="forfeitMcqBattle()">🏳️ Forfeit</button>
</div>

<!-- ── MAIN ARENA ── -->
<div class="mcq-main" id="mcq-main">
  <!-- Loading state (shown while connecting) -->
  <div class="loading-state" id="loading-state">
    <div class="loading-spinner">⏳</div>
    <div class="loading-text">Connecting to battle arena…</div>
  </div>

  <!-- Question card (hidden until game starts) -->
  <div class="question-card" id="question-card" style="display:none">
    <div>
      <span class="q-category" id="q-cat">Science: Computers</span>
      <span class="q-difficulty" id="q-diff">medium</span>
    </div>
    <div class="q-text" id="q-text">Loading question…</div>
  </div>

  <!-- Answer options -->
  <div class="options-grid" id="options-grid" style="display:none">
    <button class="option-btn" id="opt-0" onclick="submitAnswer(0)"><span class="opt-label">A</span><span class="opt-text"></span></button>
    <button class="option-btn" id="opt-1" onclick="submitAnswer(1)"><span class="opt-label">B</span><span class="opt-text"></span></button>
    <button class="option-btn" id="opt-2" onclick="submitAnswer(2)"><span class="opt-label">C</span><span class="opt-text"></span></button>
    <button class="option-btn" id="opt-3" onclick="submitAnswer(3)"><span class="opt-label">D</span><span class="opt-text"></span></button>
  </div>

  <!-- Scoreboard -->
  <div class="scoreboard" id="scoreboard" style="display:none">
    <div class="sb-player" id="sb-me">
      <span class="sb-avi" id="sb-me-avi">🥷</span>
      <div class="sb-info">
        <span class="sb-name" id="sb-me-name">You <span class="sb-you">(you)</span></span>
        <span class="sb-streak" id="sb-me-streak"></span>
        <span class="sb-status sb-waiting" id="sb-me-status">Waiting</span>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="display:flex;align-items:center;gap:16px">
        <span class="sb-score tied" id="sb-me-score">0</span>
        <span class="sb-vs">VS</span>
        <span class="sb-score tied" id="sb-opp-score">0</span>
      </div>
    </div>
    <div class="sb-player right" id="sb-opp">
      <span class="sb-avi" id="sb-opp-avi">🧙</span>
      <div class="sb-info">
        <span class="sb-name" id="sb-opp-name">Opponent</span>
        <span class="sb-streak" id="sb-opp-streak"></span>
        <span class="sb-status sb-waiting" id="sb-opp-status">Waiting</span>
      </div>
    </div>
  </div>

  <!-- Round history -->
  <div class="round-history" id="round-history" style="display:none">
    <span class="rh-label">Rounds</span>
  </div>
</div>

<!-- ── RESULT SCREEN ── -->
<div id="mcq-result">
  <div class="res-icon" id="ri">🏆</div>
  <div class="res-title" id="rt">Result</div>
  <div class="res-sub" id="rs"></div>
  <div class="stat-row" id="rstats"></div>
  <button class="play-again" onclick="window.location.href='/'">🧠 Play Again</button>
</div>

<script>
// ── AVATAR POOL ─────────────────────────────────
const AVIS = ['🥷','🧙','🧑‍💻','👾','🤖','🦸','⚡','🔥','🐉','🦊'];
function userAvi(name) { return AVIS[(name||'?').charCodeAt(0) % AVIS.length]; }

// ── STATE ───────────────────────────────────────
let myId = '';
let myName = '';
let myToken = '';
let myMcqElo = 0;
let socket = null;
let roomId = '';
let oppId = '';
let oppName = '';
let mcqState = null;
let myAnswer = null;
let isRevealing = false;

// ── TOAST ───────────────────────────────────────
let toastT;
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  clearTimeout(toastT);
  toastT = setTimeout(() => el.className = '', 3000);
}

// ── INIT ────────────────────────────────────────
window.addEventListener('load', () => {
  // Restore session from per-tab sessionStorage
  // (each tab stores its own identity to avoid cross-tab conflicts)
  const roomData = JSON.parse(sessionStorage.getItem('cosmodex_mcq_room') || 'null');

  if (!roomData || !roomData.myId || !roomData.roomId) {
    toast('Session expired — redirecting…', 'err');
    setTimeout(() => window.location.href = '/', 1500);
    return;
  }

  // Use identity embedded in the room data (per-tab, not shared)
  myToken = roomData.myToken;
  myId = roomData.myId;
  myName = roomData.myName;
  myMcqElo = roomData.myMcqElo || 1000;
  roomId = roomData.roomId;
  oppId = roomData.opponentId;
  oppName = roomData.opponentUsername;

  // Clean up the room data from sessionStorage
  sessionStorage.removeItem('cosmodex_mcq_room');

  // Connect via Socket.IO
  socket = io({ auth: { token: myToken } });

  socket.on('connect', () => {
    socket.emit('mcq_join_room', { roomId, userId: myId });
  });

  // ── MCQ Events ────────────────────────────────
  socket.on('mcq_room_state', state => {
    mcqState = state;
    renderState(state);
  });

  socket.on('mcq_round_reveal', data => {
    isRevealing = true;
    revealAnswers(data);
    setTimeout(() => { isRevealing = false; }, 3000);
  });

  socket.on('mcq_next_round', data => {
    myAnswer = null;
    isRevealing = false;
    // State update will handle rendering via mcq_room_state
  });

  socket.on('mcq_match_ended', data => {
    showResult(data);
  });

  socket.on('error', e => toast(e.message, 'err'));

  socket.on('disconnect', () => {
    toast('Disconnected from server', 'err');
  });
});

// ── RENDER STATE ────────────────────────────────
function renderState(state) {
  if (!state) return;

  // Hide loading, show game
  document.getElementById('loading-state').style.display = 'none';
  document.getElementById('question-card').style.display = '';
  document.getElementById('options-grid').style.display = '';
  document.getElementById('scoreboard').style.display = '';
  document.getElementById('round-history').style.display = '';

  // Round pill
  document.getElementById('round-pill').textContent = `Round ${state.currentRound} / ${state.totalRounds}`;

  // Timer
  updateTimer(state.roundTimeRemaining, state.status);

  // Question
  if (state.currentQuestion && state.status !== 'REVEAL') {
    document.getElementById('q-cat').textContent = state.currentQuestion.category || 'General';
    const diff = state.currentQuestion.difficulty || 'medium';
    const diffEl = document.getElementById('q-diff');
    diffEl.textContent = diff;
    diffEl.className = `q-difficulty ${diff}`;
    document.getElementById('q-text').textContent = state.currentQuestion.question;

    // Options
    const labels = ['A','B','C','D'];
    state.currentQuestion.options.forEach((opt, i) => {
      const btn = document.getElementById(`opt-${i}`);
      btn.querySelector('.opt-text').textContent = opt;
      btn.querySelector('.opt-label').textContent = labels[i];

      // Reset styles (unless revealing)
      if (!isRevealing) {
        const me = state.players[myId];
        btn.className = 'option-btn';
        if (me && me.answered && me.currentAnswer === i) {
          btn.classList.add('selected');
        }
        if (me && me.answered) {
          btn.classList.add('locked');
        }
      }
    });
  }

  // Scoreboard
  const me = state.players[myId];
  const oppKey = state.playerIds.find(id => id !== myId);
  const opp = oppKey ? state.players[oppKey] : null;

  if (me) {
    document.getElementById('sb-me-avi').textContent = userAvi(me.username);
    document.getElementById('sb-me-name').innerHTML = `${me.username} <span class="sb-you">(you)</span>`;
    const meScore = document.getElementById('sb-me-score');
    meScore.textContent = me.score;

    document.getElementById('sb-me-streak').textContent = me.streak > 1 ? `🔥 ${me.streak} streak` : '';

    const meStatus = document.getElementById('sb-me-status');
    if (me.answered) {
      meStatus.textContent = 'Answered';
      meStatus.className = 'sb-status sb-answered';
    } else if (state.status === 'REVEAL') {
      meStatus.textContent = 'Timeout';
      meStatus.className = 'sb-status';
      meStatus.style.cssText = 'background:#2d1f00;color:#fbbf24';
    } else {
      meStatus.textContent = 'Thinking…';
      meStatus.className = 'sb-status sb-waiting';
    }
  }

  if (opp) {
    document.getElementById('sb-opp-avi').textContent = userAvi(opp.username);
    document.getElementById('sb-opp-name').textContent = opp.username;
    const oppScore = document.getElementById('sb-opp-score');
    oppScore.textContent = opp.score;

    document.getElementById('sb-opp-streak').textContent = opp.streak > 1 ? `🔥 ${opp.streak} streak` : '';

    const oppStatus = document.getElementById('sb-opp-status');
    if (opp.answered) {
      oppStatus.textContent = 'Answered';
      oppStatus.className = 'sb-status sb-answered';
    } else if (state.status === 'REVEAL') {
      oppStatus.textContent = 'Timeout';
      oppStatus.className = 'sb-status';
      oppStatus.style.cssText = 'background:#2d1f00;color:#fbbf24';
    } else {
      oppStatus.textContent = 'Thinking…';
      oppStatus.className = 'sb-status sb-waiting';
    }

    // Score colors
    const meScoreEl = document.getElementById('sb-me-score');
    const oppScoreEl = document.getElementById('sb-opp-score');
    if (me && opp) {
      if (me.score > opp.score) {
        meScoreEl.className = 'sb-score leading';
        oppScoreEl.className = 'sb-score losing';
      } else if (me.score < opp.score) {
        meScoreEl.className = 'sb-score losing';
        oppScoreEl.className = 'sb-score leading';
      } else {
        meScoreEl.className = 'sb-score tied';
        oppScoreEl.className = 'sb-score tied';
      }
    }
  }

  // Round history
  renderRoundHistory(state);
}

function updateTimer(seconds, status) {
  const circle = document.getElementById('timer-circle');
  const val = document.getElementById('timer-val');
  val.textContent = Math.max(0, seconds);

  const maxTime = status === 'REVEAL' ? 3 : 15;
  const deg = Math.round(((maxTime - seconds) / maxTime) * 360);
  const color = status === 'REVEAL' ? 'var(--yellow)' : (seconds <= 3 ? 'var(--red)' : seconds <= 7 ? 'var(--yellow)' : 'var(--green)');
  const colorBg = color.replace('var(--green)', 'rgba(34,197,94,.15)')
                       .replace('var(--yellow)', 'rgba(245,158,11,.15)')
                       .replace('var(--red)', 'rgba(239,68,68,.15)');
  circle.style.background = `conic-gradient(${color} ${deg}deg, ${colorBg} ${deg}deg)`;

  circle.className = 'timer-circle';
  if (seconds <= 3 && status !== 'REVEAL') circle.classList.add('danger');
  else if (seconds <= 7 && status !== 'REVEAL') circle.classList.add('warn');
}

function renderRoundHistory(state) {
  const container = document.getElementById('round-history');
  let html = '<span class="rh-label">Rounds</span>';

  for (let i = 1; i <= state.totalRounds; i++) {
    const result = state.roundResults?.find(r => r.round === i);
    let cls = 'rh-dot';

    if (result) {
      // Check if I got it right
      const myAns = state.playerIds[0] === myId ? result.player1Answer : result.player2Answer;
      cls += myAns === result.correctIndex ? ' correct' : ' wrong';
    } else if (i === state.currentRound) {
      cls += ' current';
    } else {
      cls += ' upcoming';
    }

    html += `<div class="${cls}">${i}</div>`;
  }

  container.innerHTML = html;
}

// ── FORFEIT MCQ BATTLE ──────────────────────────
function forfeitMcqBattle() {
  if (!confirm('Are you sure you want to forfeit? Your opponent will win.')) return;
  if (socket && roomId && myId) {
    socket.emit('mcq_leave_room', { roomId, userId: myId });
  }
  toast('🏳️ You forfeited the battle', 'err');
  setTimeout(() => { window.location.href = '/'; }, 1500);
}

// ── SUBMIT ANSWER ───────────────────────────────
function submitAnswer(index) {
  if (myAnswer !== null || isRevealing) return; // Already answered or revealing
  if (!mcqState || mcqState.status !== 'ACTIVE') return;

  myAnswer = index;

  // Visual feedback immediately
  for (let i = 0; i < 4; i++) {
    const btn = document.getElementById(`opt-${i}`);
    btn.classList.add('locked');
    if (i === index) btn.classList.add('selected');
  }

  socket.emit('mcq_answer', { roomId, userId: myId, answerIndex: index });
  toast('Answer submitted! ✓', 'ok');
}

// ── REVEAL ANSWERS ──────────────────────────────
function revealAnswers(data) {
  const correctIdx = data.correctIndex;

  for (let i = 0; i < 4; i++) {
    const btn = document.getElementById(`opt-${i}`);
    btn.classList.add('locked');
    btn.classList.remove('selected');

    if (i === correctIdx) {
      btn.classList.add('correct');
    }

    // My wrong answer
    const myData = data.players[myId];
    if (myData && myData.answer === i && !myData.correct) {
      btn.classList.add('wrong');
    }
  }

  // Toast
  const myResult = data.players[myId];
  if (myResult) {
    if (myResult.correct) {
      toast('✅ Correct!', 'ok');
    } else if (myResult.answer === null) {
      toast('⏱ Time\'s up!', 'warn');
    } else {
      toast('❌ Wrong answer', 'err');
    }
  }
}

// ── RESULT SCREEN ───────────────────────────────
function showResult(data) {
  const result = document.getElementById('mcq-result');
  result.classList.add('on');

  const meScore = data.finalScores?.[myId] ?? 0;
  const oppScore = Object.entries(data.finalScores || {}).find(([k]) => k !== myId)?.[1] ?? 0;

  let icon, title, cls, sub;
  if (data.reason === 'opponent_forfeit' && data.forfeitedBy !== myId) {
    icon = '🏆'; title = 'VICTORY'; cls = 'win-t';
    sub = 'Your opponent forfeited! You win by default.';
  } else if (data.reason === 'opponent_forfeit' && data.forfeitedBy === myId) {
    icon = '🏳️'; title = 'FORFEITED'; cls = 'lose-t';
    sub = 'You forfeited the battle.';
  } else if (!data.winnerId) {
    icon = '🤝'; title = 'DRAW'; cls = 'draw-t';
    sub = `Both fighters scored ${meScore}. A tie breaker awaits!`;
  } else if (data.winnerId === myId) {
    icon = '🏆'; title = 'VICTORY'; cls = 'win-t';
    sub = `You won ${meScore} to ${oppScore}! Your MCQ ELO has been updated.`;
  } else {
    icon = '💀'; title = 'DEFEATED'; cls = 'lose-t';
    sub = `You lost ${meScore} to ${oppScore}. Better luck next time!`;
  }

  document.getElementById('ri').textContent = icon;
  document.getElementById('rt').textContent = title;
  document.getElementById('rt').className = 'res-title ' + cls;
  document.getElementById('rs').textContent = sub;
  document.getElementById('rstats').innerHTML = `
    <div class="sbox"><div class="sval">${meScore}</div><div class="slbl">Your Score</div></div>
    <div class="sbox"><div class="sval">${oppScore}</div><div class="slbl">Opponent</div></div>
    <div class="sbox"><div class="sval">${mcqState?.totalRounds ?? 10}</div><div class="slbl">Rounds</div></div>
  `;
}
</script>
