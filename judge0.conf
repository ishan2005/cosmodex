################################################################################
# COSMODEX — judge0.conf
# Configuration for Judge0 CE (Community Edition) running via Docker Compose.
# Reference: https://github.com/judge0/judge0/blob/master/judge0.conf
################################################################################

# ── DATABASE ──────────────────────────────────────────────────────
POSTGRES_HOST=judge0-db
POSTGRES_USERNAME=postgres
POSTGRES_PASSWORD=judge0password
POSTGRES_DATABASE=judge0

# ── CACHE ─────────────────────────────────────────────────────────
# Judge0 workers use REDIS_HOST + REDIS_PORT (not REDIS_URL) for the job queue
REDIS_URL=redis://judge0-redis:6379
REDIS_HOST=judge0-redis
REDIS_PORT=6379

# ── SECURITY ──────────────────────────────────────────────────────
# Set this to a random value and add X-Auth-Token header in requests
# AUTH_TOKEN=your_random_token_here

# ── RESOURCE LIMITS ───────────────────────────────────────────────
CPU_TIME_LIMIT=3
CPU_EXTRA_TIME=0.5
WALL_TIME_LIMIT=10
MEMORY_LIMIT=131072
STACK_LIMIT=65536
MAX_PROCESSES_AND_OR_THREADS=30
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
MAX_FILE_SIZE=1024

# ── SUBMISSIONS ────────────────────────────────────────────────────
MAX_QUEUE_SIZE=100
MAX_SUBMISSION_BATCH_SIZE=20

# ── SERVER ────────────────────────────────────────────────────────
RAILS_ENV=production
ALLOW_ORIGIN=*

# ── WORKERS ───────────────────────────────────────────────────────
# Number of parallel workers (adjust based on CPU cores)
INTERVAL=0.1
COUNT=10
