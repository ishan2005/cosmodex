# Render deployment configuration
# See: https://render.com/docs/deploy-node-express-app

databases:
  - name: cosmodex-db
    plan: free
    databaseName: cosmodex
    user: cosmodex

services:
  - type: web
    name: cosmodex-battle-server
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cosmodex-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: PORT
        value: 3000
